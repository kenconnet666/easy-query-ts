# 本仓库的开发与实库测试数据库，运行在 WSL Debian 的 Docker 里。
# compose 项目名与端口都和 vue-tsx-pro-dev、easy-query-dev 错开，几个项目可以同时存在。
# HANA 体积大、首次启动要初始化 6～11 分钟（之后带着数据卷启动不到 1 分钟，快照见 hana/volume.sh），内存上限 8 GB，
# 放在 hana profile 里按需启动；启动它即按镜像的说明接受 SAP 的许可。
# MySQL 8.0.18（PolarDB 基线）放在 polardb profile 里：本地实库测试只跑 8.4，基线由 CI 的 8.0.18 服务容器把关，要在本机复现时再启动。
#
# 用法：在仓库根目录执行（Windows 下前面加 `wsl -d Debian --`）
#   bash infra/dev/db.sh up -d                    # MySQL 8.4、PG 17、Redis 8.2（端口 36379）
#   bash infra/dev/db.sh --profile polardb up -d  # 再加 MySQL 8.0.18（PolarDB 基线，端口 33318）
#   bash infra/dev/db.sh --profile hana up -d     # 再加 HANA
#   bash infra/dev/db.sh --profile mssql up -d    # 再加 SQL Server 2022（端口 31433）
#   bash infra/dev/db.sh --profile oracle up -d   # 再加 Oracle 23ai Free（端口 31521，服务名 FREEPDB1，用户 eqts）
#   bash infra/dev/db.sh --profile mariadb up -d  # 再加 MariaDB 11.4（端口 33307）
#   bash infra/dev/db.sh stop
# 每个服务的 mem_limit 与 memswap_limit 相同：超了就地报错，不去占交换区拖慢整台机器。
# 密码与连接串在 .local/（不提交），首次由 db.sh 生成；实库测试从 .local/db.env 里的 EQTS_* 环境变量读连接。
name: easy-query-ts-dev

x-mysql: &mysql
  restart: unless-stopped
  # 这个容器同时装着 C# 版（EasyQuerySharp）的测试库：1g 时顶着上限，建表慢到用例超时
  mem_limit: 2g
  memswap_limit: 2g
  environment:
    MYSQL_ROOT_PASSWORD: ${EQTS_DEV_MYSQL_PASSWORD:?run infra/dev/db.sh to create .local/db.env}
    MYSQL_DATABASE: eqts
    TZ: Asia/Shanghai
  healthcheck:
    test:
      [
        CMD-SHELL,
        'MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u root -e "SELECT 1" >/dev/null',
      ]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 20s

services:
  # 生产 PolarDB MySQL 版报告的内核是 8.0.18：MySQL 方言与流程引擎在这里验证不用到 8.0.19+ 的写法
  mysql8018:
    <<: *mysql
    profiles: [polardb]
    image: mysql:8.0.18@sha256:e1b0fd480a11e5c37425a2591b6fbd32af886bfc6d6f404bd362be5e50a2e632
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --max-connections=200
    ports:
      - '33318:3306'
    volumes:
      - mysql8018-data:/var/lib/mysql

  mysql84:
    <<: *mysql
    image: mysql:8.4.11@sha256:1f8411cc085d2f2f92060fca926746cbf97f87b76c3008e9741ad62e604c4ffa
    command:
      - --mysql-native-password=ON
      - --authentication-policy=mysql_native_password
      - --character-set-server=utf8mb4
      - --max-connections=200
    ports:
      - '33306:3306'
    volumes:
      - mysql84-data:/var/lib/mysql

  # MariaDB 11.4 LTS（MySQL 协议，方言见 easy-query-ts-mysql 的 mariadb()）：按需启动
  mariadb:
    profiles: [mariadb]
    image: mariadb:11.4.13@sha256:d1891ede5a559f1086f55053bb8cc1569b0298338c4d72d71725a7f74f6ba620
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      MARIADB_ROOT_PASSWORD: ${EQTS_DEV_MARIADB_PASSWORD:?run infra/dev/db.sh to create .local/db.env}
      MARIADB_DATABASE: eqts
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --max-connections=200
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 20s
    ports:
      - '33307:3306'
    volumes:
      - mariadb-data:/var/lib/mysql

  postgres:
    image: postgres:17.11-bookworm@sha256:66aafa11cf15800a3c94763f7e11d1e7b2e37e5e84bc4ce027cb6e1e4bfaf4df
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EQTS_DEV_PG_PASSWORD:?run infra/dev/db.sh to create .local/db.env}
      POSTGRES_DB: eqts
      TZ: Asia/Shanghai
    command: [postgres, -c, max_connections=200]
    ports:
      - '35432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 3s
      timeout: 3s
      retries: 20

  # Redis 8.2：二级缓存接 Redis 的示例实现（测试里的共享存储与失效通知）的实测；只当缓存用，不落盘
  redis:
    image: redis:8.2.3-alpine@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      REDISCLI_AUTH: ${EQTS_DEV_REDIS_PASSWORD:?run infra/dev/db.sh to create .local/db.env}
    command: [sh, -c, 'exec redis-server --requirepass "$$REDISCLI_AUTH" --save "" --appendonly no']
    ports:
      - '36379:6379'
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  # SQL Server 2022 Developer（免费、功能完整）；方言按 version 选项渲染旧版本的写法，这里只跑最新版
  mssql:
    profiles: [mssql]
    # 2022 CU27（16.0.4305.5）
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${EQTS_DEV_MSSQL_PASSWORD:?add EQTS_DEV_MSSQL_PASSWORD to .local/db.env}
      TZ: Asia/Shanghai
    ports:
      - '31433:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          CMD-SHELL,
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Oracle Database 23ai Free（gvenzl 维护的精简镜像）；方言按 version 选项渲染 12c 之前的写法
  oracle:
    profiles: [oracle]
    image: gvenzl/oracle-free:23-slim@sha256:6d61d267a3b978c24c5ac1790e62e927416a0aec446bd86e4b3a1527562757bd
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      ORACLE_PASSWORD: ${EQTS_DEV_ORACLE_PASSWORD:?add EQTS_DEV_ORACLE_PASSWORD to .local/db.env}
      APP_USER: eqts
      APP_USER_PASSWORD: ${EQTS_DEV_ORACLE_PASSWORD:?add EQTS_DEV_ORACLE_PASSWORD to .local/db.env}
      TZ: Asia/Shanghai
    ports:
      - '31521:1521'
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [CMD, healthcheck.sh]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 1m

  hana:
    profiles: [hana]
    build: ./hana
    image: easy-query-ts-dev/hana:2.00.088
    platform: linux/amd64
    hostname: hxehost
    restart: unless-stopped
    # HANA 把 cgroup 上限当物理内存，取 90% 作全局分配上限。镜像里关掉了测试用不到的服务（见 hana/）。
    # 这个上限把代码段与共享内存（约 1.9 GB）也算在内，系统库与租户库的堆再占 3.3 GB 以上：
    # 6g 跑得过一轮测试，但开上十个小时就卡在上限上（连接都建不了），所以留出余量
    mem_limit: 8g
    memswap_limit: 8g
    shm_size: 2g
    stop_grace_period: 2m
    environment:
      EQ_HANA_PASSWORD: ${EQTS_DEV_HANA_PASSWORD:?run infra/dev/db.sh to create .local/db.env}
      TZ: Asia/Shanghai
    ports:
      - '39041:39041'
      - '39017:39017'
    volumes:
      - hana-data:/hana/mounts
    tmpfs:
      - /run/eq:size=1m,mode=0700,uid=12000,gid=79
    entrypoint: [/bin/bash, /eq/start.sh]
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      kernel.shmmax: 1073741824
      kernel.shmmni: 32768
      kernel.shmall: 8388608
      net.ipv4.ip_local_port_range: '40000 60999'
    healthcheck:
      test: [CMD, /bin/bash, /eq/health.sh]
      interval: 5s
      timeout: 5s
      retries: 180
      start_period: 2m

  # 达梦 DM8（社区镜像，官方只提供下载的 tar）：UTF-8、长度按字符、大小写敏感（与官方默认一致）
  dameng:
    profiles: [dameng]
    image: xuxuclassmate/dameng:latest@sha256:c4088323442747a45d58bd33ef59e657c9b85f9e7dd956ba60b36d04a35b141d
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      SYSDBA_PWD: ${EQTS_DEV_DAMENG_PASSWORD:?run infra/dev/db.sh to add EQTS_DEV_DAMENG_PASSWORD}
      UNICODE_FLAG: 1
      LENGTH_IN_CHAR: 1
      CASE_SENSITIVE: 1
      TZ: Asia/Shanghai
    ports:
      - '35236:5236'
    volumes:
      - dameng-data:/opt/dmdbms/data

  # openGauss（官方镜像，PG 协议；GaussDB 的开源版）
  opengauss:
    profiles: [opengauss]
    image: opengauss/opengauss-server:latest@sha256:d554be1b8b08165a8b19348f0ca236b5d61a4832ffadac0340ded973c34f38e4
    restart: unless-stopped
    privileged: true
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      GS_PASSWORD: ${EQTS_DEV_OPENGAUSS_PASSWORD:?run infra/dev/db.sh to add EQTS_DEV_OPENGAUSS_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - '35433:5432'
    volumes:
      - opengauss-data:/var/lib/opengauss

  # ClickHouse 25.8 LTS（HTTP 接口，驱动 @clickhouse/client）
  clickhouse:
    profiles: [clickhouse]
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      CLICKHOUSE_USER: eqts
      CLICKHOUSE_PASSWORD: ${EQTS_DEV_CLICKHOUSE_PASSWORD:?run infra/dev/db.sh to add EQTS_DEV_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: eqts
      TZ: Asia/Shanghai
    ports:
      - '38123:8123'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  # Apache Doris 4.1（单容器 FE + BE，MySQL 协议 9030；root 无密码，只给本机测试用）
  doris:
    profiles: [doris]
    image: apache/doris:all-in-one-4.1.3@sha256:82a5cabc7900ebcd3d080412d636c0cebd6602799fffe2605c652b2ea7d42609
    restart: unless-stopped
    mem_limit: 8g
    memswap_limit: 8g
    ports:
      - '39030:9030'
      - '38030:8030'

  # IBM Db2 12.1 Community（privileged；首次初始化要几分钟，日志出现 Setup has completed 后可用）
  db2:
    profiles: [db2]
    image: icr.io/db2_community/db2:12.1.2.0@sha256:9cc0d21df5d86cd9a5ce1c65c390dc10d56b1d38ab6e992c8a08eda677368781
    restart: unless-stopped
    privileged: true
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${EQTS_DEV_DB2_PASSWORD:?run infra/dev/db.sh to add EQTS_DEV_DB2_PASSWORD}
      DBNAME: eqts
      ARCHIVE_LOGS: 'false'
      AUTOCONFIG: 'false'
      TZ: Asia/Shanghai
    ports:
      - '35000:50000'
    volumes:
      - db2-data:/database

  # TDengine 3.3（时序库；taosAdapter 的 WebSocket 接口 6041，默认账号 root / taosdata，只给本机测试用）
  tdengine:
    profiles: [tdengine]
    image: tdengine/tdengine:3.3.6.13@sha256:79d32ce8a42f64c7dbfc33946a36b3e176ea23c0cd695a1bc9e8aa889ca03b88
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      TZ: UTC
    ports:
      - '36041:6041'

volumes:
  mysql8018-data:
  mysql84-data:
  mariadb-data:
  postgres-data:
  hana-data:
  mssql-data:
  oracle-data:
  dameng-data:
  opengauss-data:
  clickhouse-data:
  db2-data:
