packages:
  - packages/*
  - apps/*

# 依赖的安装脚本：oracledb 的 install 只检查 Thick 模式的原生模块，easy-query-ts-oracle 用 Thin 模式（纯 JS），不运行；
# ibm_db 的 install 要下载上百 MB 的 IBM CLI 驱动，只在跑 Db2 实库测试时手动执行（pnpm --filter @zerodep-dev/easy-query-ts-db2 driver）
allowBuilds:
  oracledb: false
  ibm_db: false
  # @tdengine/websocket 经 websocket 包带进来：bufferutil、utf-8-validate 是可选的原生加速（没有时用纯 JS），es5-ext 的脚本只打印信息
  bufferutil: false
  utf-8-validate: false
  es5-ext: false

# 共享依赖的精确版本；各包用 "catalog:" 引用，升级只改这里
catalog:
  # 列类型包的 peer 依赖
  '@internationalized/date': 3.12.4
  decimal.js: 10.6.0
  zod: 4.6.7
  # 数据库驱动（各方言包的 peer 依赖，开发与实库测试时安装）
  mysql2: 3.11.5
  pg: 8.13.1
  '@types/pg': 8.11.10
  hdb: 2.30.1
  mssql: 12.7.8
  '@types/mssql': 12.3.0
  oracledb: 7.0.1
  '@types/oracledb': 7.0.3
  '@duckdb/node-api': 1.5.6-r.1
  dmdb: 1.0.52452
  '@clickhouse/client': 1.24.1
  ibm_db: 4.1.0
  '@tdengine/websocket': 3.5.0
  # 嵌入式与 serverless 驱动：PGlite 跑共用套件不用容器；libSQL 本地文件库
  '@electric-sql/pglite': 0.5.10
  '@libsql/client': 0.18.0
  '@neondatabase/serverless': 1.2.0
  # 只在测试里：二级缓存接 Redis 的示例实现（缓存包不依赖它）
  ioredis: 6.0.0
  # 文档站（apps/docs）：用发布到 npm 的组件库写
  '@zerodep-dev/vue-tsx-pro-tsx': 0.11.2
  '@zerodep-dev/vue-tsx-pro-ui': 0.11.2
  vue: 3.5.44
  vue-router: 5.4.0
  vite: 8.3.4
  '@lucide/icons': 1.69.0
  shiki: 4.5.0
  '@shikijs/langs': 4.5.0
  pinyin-pro: 3.29.5
  # 文档站演练场的编辑器
  '@codemirror/autocomplete': 6.20.3
  '@codemirror/commands': 6.11.1
  '@codemirror/lang-javascript': 6.2.5
  '@codemirror/language': 6.13.1
  '@codemirror/search': 6.7.2
  '@codemirror/state': 6.7.6
  '@codemirror/view': 6.43.14
  '@lezer/highlight': 1.2.5
  # 文档站在浏览器里真实运行示例的 WASM 数据库（PGlite 在上面）
  '@sqlite.org/sqlite-wasm': 3.54.1-build1
  # 文档站的整站检查（apps/docs/test/site.mjs）
  playwright: 1.64.1
  # 语言与工具
  typescript: 7.1.0-beta
  '@types/node': 24.19.2
  vitest: 5.0.5
  oxlint: 1.88.0
  oxlint-tsgolint: 7.0.2004
  prettier: 3.9.10
  '@prettier/plugin-oxc': 0.2.3

minimumReleaseAgeExclude:
  - '@lucide/icons@1.69.0'
  # 自己的包（vue-tsx-pro 仓库），发布即用
  - '@zerodep-dev/vue-tsx-pro-tsx'
  - '@zerodep-dev/vue-tsx-pro-ui'

# 仓库内的 Node 进程（Vitest 配置、脚本）直接解析各包源码，不用先构建。
# 配置文件要用 --configLoader native 加载（Node 自己去掉类型），默认的打包加载会绕过这个条件、去读 dist
nodeOptions: '--conditions=@easy-query-ts/source'
